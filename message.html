<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأتك وصلت 🎁</title>

<style>
body {
    margin: 0; padding: 0; overflow-x: hidden;
    background: linear-gradient(-45deg, #0077b6, #ffffff, #ffb7c5, #ac7373);
    background-size: 400% 400%; animation: bg 15s infinite;
    font-family: 'Segoe UI', sans-serif; text-align: center;
}
@keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

#startScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #ffffff, #e0f2fe);
    z-index: 1000;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding:20px;
}

.box {
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    width:100%;
    max-width:400px;
}

.names-box {
    font-size:22px;
    font-weight:bold;
    background:#f0f8ff;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

input {
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-bottom:15px;
}

.big-btn {
    width:100%;
    padding:18px;
    border:none;
    border-radius:50px;
    background:#0077b6;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.content { display:none; padding:20px; max-width:500px; margin:auto; }
#userImage { width:100%; border-radius:20px; display:none; margin:15px 0; border:5px solid white; box-shadow:0 5px 15px rgba(0,0,0,0.2); }
#typewriter { font-size:22px; font-weight:bold; color:#333; background:rgba(255,255,255,0.6); padding:15px; border-radius:15px; margin:15px 0; }
iframe, video { width:100%; border-radius:15px; margin-top:10px; }
.particle { position:fixed; bottom:-50px; animation:fly 6s linear infinite; pointer-events:none; }
@keyframes fly { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
</style>
</head>
<body>

<div id="startScreen">
    <div class="box">
        <div class="names-box" id="namesBox"></div>
        <input type="password" id="enteredPass" placeholder="اكتب كلمة سر حبنا يا قلبي 🔐">
        <button class="big-btn" onclick="checkPassword()">افتح العظمة يا قمري 💙</button>
    </div>
</div>

<div class="content" id="mainContent">
    <h2 id="toHeader" style="color:#0077b6;"></h2>
    <img id="userImage" src="">
    <div id="videoContainer"></div>
    <div id="typewriter"></div>
    <div id="audioContainer"></div>
    <a href="index.html" style="color:#ac7373;font-weight:bold;text-decoration:none;display:block;margin-top:20px;">رد المفاجأة بمثلها 💌</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const correctPass = decodeURIComponent(params.get("p") || "");

document.getElementById('namesBox').innerText =
`${params.get('from') || 'محبك'} ❤️ ${params.get('to') || 'حبيبي'}`;

document.getElementById('toHeader').innerText =
`إلى: ${params.get('to') || 'حبيبي'} ✨`;

function checkPassword(){
    const entered = document.getElementById("enteredPass").value;

    if(entered === correctPass){
        document.getElementById('startScreen').style.display='none';
        document.getElementById('mainContent').style.display='block';
        startShow();
    } else {
        alert("كلمة السر غلط يا قمري 😢");
    }
}

function startShow(){

    const img = params.get('i');
    if(img && img !== "undefined"){
        const imgTag = document.getElementById('userImage');
        imgTag.src = decodeURIComponent(img);
        imgTag.style.display='block';
    }

    const audio = params.get('a');
    if(audio){
        document.getElementById('audioContainer').innerHTML =
        `<audio id="m" autoplay loop><source src="${decodeURIComponent(audio)}"></audio>`;
        document.getElementById('m').play().catch(()=>{});
    }

    const video = params.get('v');
    if(video){
        let vArea = document.getElementById('videoContainer');
        let url = decodeURIComponent(video);
        if(url.includes('youtube') || url.includes('youtu.be')){
            let id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
            vArea.innerHTML =
            `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1"
            frameborder="0" allow="autoplay" style="height:250px;"></iframe>`;
        } else {
            vArea.innerHTML =
            `<video controls autoplay style="max-height:250px;">
            <source src="${url}"></video>`;
        }
    }

    typeWriter(decodeURIComponent(params.get('m') || ""), 0);
    setInterval(createParticle, 300);
}

function typeWriter(text, i){
    if(i < text.length){
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        setTimeout(()=> typeWriter(text, i+1), 60);
    }
}

function createParticle(){
    const p = document.createElement('div');
    p.className='particle';
    p.innerText=['💙','✨','💎'][Math.floor(Math.random()*3)];
    p.style.left=Math.random()*100+'vw';
    p.style.fontSize='25px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),6000);
}
</script>

</body>
</html>
